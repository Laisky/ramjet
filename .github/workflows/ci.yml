name: ci

on:
  push:
    branches:
      - 'master'
      - 'test/ci'

jobs:
  build_latest:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      -
        name: Build and push latest
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ppcelery/ramjet:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build_hash:
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Record immutable source image
        id: image
        run: |
          short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          echo "SHORT_SHA=$short_sha" >> "$GITHUB_ENV"
          echo "image=ppcelery/ramjet:$short_sha" >> "$GITHUB_OUTPUT"

      -
        name: Build and push hash label
        id: publish
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ppcelery/ramjet:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
      runs-on: ubuntu-latest
      needs: [build_latest, build_hash]
      steps:
      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TARGET_HOST }}
          username: ${{ secrets.TARGET_HOST_USERNAME }}
          password: ${{ secrets.TARGET_HOST_PASSWORD }}
          port: ${{ secrets.TARGET_HOST_SSH_PORT }}
          script: |
            set -eu
            cd /home/laisky/repo/laisky/VPS
            docker compose -f home-docker-compose.yml pull ramjet
            docker compose -f home-docker-compose.yml up -d --no-deps --force-recreate ramjet
            accepted=false
            for _attempt in $(seq 1 30); do
              if docker compose -f home-docker-compose.yml exec -T ramjet python /app/scripts/check_container_health.py; then
                accepted=true
                break
              fi
              sleep 2
            done
            test "$accepted" = true
            echo "Ramjet latest image and service health accepted."

