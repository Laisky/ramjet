name: ci

on:
  push:
    branches:
      - 'master'
      - 'test/ci'

jobs:
  build_latest:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      -
        name: Build and push latest
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ppcelery/ramjet:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build_hash:
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Record immutable source image
        id: image
        run: |
          short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          echo "SHORT_SHA=$short_sha" >> "$GITHUB_ENV"
          echo "image=ppcelery/ramjet:$short_sha" >> "$GITHUB_OUTPUT"

      -
        name: Build and push hash label
        id: publish
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ppcelery/ramjet:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
      runs-on: ubuntu-latest
      needs: [build_latest, build_hash]
      steps:
      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TARGET_HOST }}
          username: ${{ secrets.TARGET_HOST_USERNAME }}
          password: ${{ secrets.TARGET_HOST_PASSWORD }}
          port: ${{ secrets.TARGET_HOST_SSH_PORT }}
          script: |
            set -eu
            cd /home/ubuntu/repo/VPS
            image="${{ needs.build_hash.outputs.image }}@${{ needs.build_hash.outputs.digest }}"
            previous=""
            cid="$(docker-compose -f bj-docker-compose.yml ps -q ramjet)"
            if [ -n "$cid" ]; then
              previous="$(docker inspect -f '{{.Image}}' "$cid")"
            fi
            docker pull "$image"
            expected="$(docker image inspect -f '{{.Id}}' "$image")"
            health_code="$(docker run --rm --network none --read-only --entrypoint cat "$image" /app/scripts/check_container_health.py)"
            override="$(mktemp)"
            trap 'rm -f "$override"' EXIT HUP INT TERM
            printf 'services:\n  ramjet:\n    image: "%s"\n' "$image" > "$override"
            accepted=false
            if docker-compose -f bj-docker-compose.yml -f "$override" up -d --no-deps --force-recreate ramjet; then
              cid="$(docker-compose -f bj-docker-compose.yml ps -q ramjet)"
              if [ -n "$cid" ] && [ "$(docker inspect -f '{{.Image}}' "$cid")" = "$expected" ]; then
                for _attempt in $(seq 1 30); do
                  if docker exec "$cid" python -c "$health_code"; then
                    accepted=true
                    break
                  fi
                  sleep 2
                done
              fi
            fi
            if [ "$accepted" != true ]; then
              echo "Ramjet candidate was not accepted; restoring the previous immutable image."
              if [ -n "$previous" ]; then
                printf 'services:\n  ramjet:\n    image: "%s"\n' "$previous" > "$override"
                docker-compose -f bj-docker-compose.yml -f "$override" up -d --no-deps --force-recreate ramjet
                restored="$(docker-compose -f bj-docker-compose.yml ps -q ramjet)"
                test -n "$restored"
                test "$(docker inspect -f '{{.Image}}' "$restored")" = "$previous"
                recovered=false
                for _attempt in $(seq 1 30); do
                  if docker exec "$restored" python -c "$health_code"; then
                    recovered=true
                    break
                  fi
                  sleep 2
                done
                test "$recovered" = true
                echo "Previous Ramjet image and health restored."
              else
                echo "No previous Ramjet container was available for automatic rollback." >&2
                if [ -n "$cid" ]; then docker stop "$cid"; fi
              fi
              exit 1
            fi
            echo "Ramjet immutable image and service health accepted."

