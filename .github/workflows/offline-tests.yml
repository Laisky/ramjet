name: offline tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only quick-gate tools
        run: python -m pip install black==26.1.0 pytest==8.4.2
      - name: Verify failure reporting
        run: python -m unittest discover -s .scripts -p test_fast_ci.py -v
      - name: Changed Python formatting and packaging contracts
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base="$(git rev-parse HEAD^)"; fi
          python .scripts/fast_ci.py --base "$base" --evidence "$RUNNER_TEMP/fast-ci"
      - name: Retain exact discovery, exits and timing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fast-ci-${{ github.sha }}
          path: ${{ runner.temp }}/fast-ci
          if-no-files-found: error
          retention-days: 14
